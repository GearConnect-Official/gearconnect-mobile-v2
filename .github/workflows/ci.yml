name: CI
on:
  pull_request:
    branches: [main, develop, preprod]
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install
      
      - name: Lint
        run: bun run lint

      - name: Format Check
        run: bun run format:check

      - name: Tests
        run: bun run test